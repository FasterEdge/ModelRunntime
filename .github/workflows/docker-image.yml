name: 'Docker 镜像构建'
on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
    tags:
      - 'v*'          # 打 v0.1.0 等标签时自动构建并产出镜像
  release:
    types: [published, released]
permissions:
  contents: write

jobs:
  docker-build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: '构建 Docker 镜像'
      run: |
        docker build -f python_pb/Dockerfile -t model-runntime python_pb
    - name: '导出并上传镜像工件'
      run: |
        docker save model-runntime | gzip > model-runntime-image.tar.gz
    # PR 的 ref_name 形如 15/merge,dependabot 分支名也含斜杠,
    # 而 upload-artifact 的工件名不允许出现 /,这里统一替换为连字符。
    - name: '计算工件名'
      shell: bash
      run: echo "ARTIFACT_NAME=model-runntime-docker-image-${GITHUB_REF_NAME//\//-}" >> "$GITHUB_ENV"
    - uses: actions/upload-artifact@v7
      with:
        name: ${{ env.ARTIFACT_NAME }}
        path: 'model-runntime-image.tar.gz'
        if-no-files-found: 'warn'
        retention-days: 14
    - name: '生成 MD5/SHA1 校验文件'
      if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v')
      run: |
        set -euo pipefail
        md5sum model-runntime-image.tar.gz > checksums-md5.txt
        sha1sum model-runntime-image.tar.gz > checksums-sha1.txt
    - name: '上传镜像包到 Release'
      if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v3
      with:
        tag_name: ${{ github.event.release.tag_name || github.ref_name }}
        files: |
          model-runntime-image.tar.gz
          checksums-md5.txt
          checksums-sha1.txt
        fail_on_unmatched_files: false
